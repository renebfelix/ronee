# Dispara a cada 5 minutos a rota que envia os lembretes de eventos da Agenda por push.
# Configure em Settings → Secrets and variables → Actions:
#   variável RONEE_CALENDAR_REMINDERS_URL (ex.: https://SEU-DOMINIO/api/cron/agenda)
#   segredo  RONEE_NEXT_PUBLIC_CRON_SECRET            (o mesmo valor do ambiente de produção)
# O GitHub pode atrasar execuções agendadas em alguns minutos; a rota tolera até 30 min de atraso.
name: Lembretes da agenda

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    if: vars.RONEE_CALENDAR_REMINDERS_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/agenda
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.RONEE_NEXT_PUBLIC_CRON_SECRET }}" \
            "${{ vars.RONEE_CALENDAR_REMINDERS_URL }}"
