<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · Ronee</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f5f6fb;
        --surface: #ffffff;
        --border: #e3e6ef;
        --text: #161a2b;
        --muted: #636b85;
        --primary: #5b5bf0;
        --on-primary: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1020;
          --surface: #161a2e;
          --border: #2a3050;
          --text: #eef0fa;
          --muted: #a3aac4;
          --primary: #8183ff;
          --on-primary: #0e1020;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        text-align: center;
      }
      .card {
        max-width: 380px;
        padding: 40px 24px;
        border-radius: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      img { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 1.375rem; }
      p { margin-top: 8px; color: var(--muted); line-height: 1.5; }
      button {
        margin-top: 24px;
        height: 46px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está offline</h1>
      <p>Não foi possível conectar. Verifique sua internet e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
